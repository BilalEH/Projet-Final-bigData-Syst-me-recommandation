name: Build and Push Docker Image

on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'my-project' with your actual repository or project name
          tags: ${{ secrets.DOCKER_USERNAME }}/Projet-Final-bigData-Syst-me-recommandation:latest